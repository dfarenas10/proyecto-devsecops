name: DevSecOps Pipeline

on: [push, pull_request]

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verificar directorio antes de ZAP
        run: ls -lah $(pwd)

      - name: Esperar a que la aplicación esté accesible (si aplica)
        run: |
          timeout 60 sh -c 'until curl -s http://localhost:3000; do sleep 5; done' || echo "La aplicación no respondió, se intentará el escaneo de todas formas"

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm -v $(pwd):/zap/wrk/:rw \
            owasp/zap2docker-stable zap-baseline.py -t http://localhost:3000 -r zap_report.html || true

      - name: Verificar existencia de zap_report.html
        run: |
          if [ ! -f $(pwd)/zap_report.html ]; then
            echo "Error: zap_report.html no se generó correctamente"
            exit 1
          fi

      - name: Convertir reporte ZAP a JSON
        run: |
          docker run --rm -v $(pwd):/zap/wrk/:rw \
            owasp/zap2docker-stable zap-json-report.py -f zap_report.html -o zap_report.json || true

      - name: Verificar existencia de zap_report.json
        run: |
          if [ ! -f $(pwd)/zap_report.json ]; then
            echo "Error: zap_report.json no se generó correctamente"
            echo "Mostrando contenido del directorio actual:"
            ls -lah $(pwd)
            echo "Mostrando logs del reporte HTML (primeras 20 líneas):"
            head -n 20 zap_report.html || echo "No se encontró zap_report.html"
            exit 1
          fi

      - name: Subir resultados de ZAP a DefectDojo
        run: |
          curl -X POST "http://$DEFECTDOJO_URL/api/v2/import-scan/" \
            -H "Authorization: Token $DEFECTDOJO_API_TOKEN" \
            --form "scan_type=ZAP Scan" \
            --form "engagement=$ENGAGEMENT_ID" \
            --form "file=@zap_report.json"

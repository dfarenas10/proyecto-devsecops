name: DevSecOps Pipeline

on: [push, pull_request]

jobs:
  cleanup-defectdojo:
    runs-on: ubuntu-latest
    steps:
      - name: Check and Delete Previous Reports in DefectDojo
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DEFECTDOJO_ENGAGEMENT_ID: ${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}
        run: |
          REPORTS_URL="$DEFECTDOJO_URL/api/v2/findings/?engagement=$DEFECTDOJO_ENGAGEMENT_ID"
          response=$(curl -s -X GET "$REPORTS_URL" -H "Authorization: Token $DEFECTDOJO_API_KEY" -H "Content-Type: application/json")
          findings=$(echo "$response" | jq '.results | length')

          if [ "$findings" -gt 0 ]; then
            echo "Previous reports found ($findings), deleting..."
            echo "$response" | jq -r '.results[].id' | while read -r finding_id; do
              DELETE_URL="$DEFECTDOJO_URL/api/v2/findings/$finding_id/"
              curl -s -X DELETE "$DELETE_URL" -H "Authorization: Token $DEFECTDOJO_API_KEY"
            done
            echo "Previous reports deleted successfully."
          else
            echo "No previous reports found. Skipping deletion."
          fi

  semgrep:
    needs: cleanup-defectdojo
    runs-on: ubuntu-latest
    steps:
      # (Código de Semgrep intacto)

  trivy:
    needs: cleanup-defectdojo
    runs-on: ubuntu-latest
    steps:
      # (Código de Trivy intacto)

  gitleaks:
    needs: cleanup-defectdojo
    runs-on: ubuntu-latest
    steps:
      # (Código de Gitleaks intacto)

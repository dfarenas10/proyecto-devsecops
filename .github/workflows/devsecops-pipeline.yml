name: DevSecOps Pipeline

on: [push, pull_request]

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep and jq
        run: |
          pip install semgrep
          sudo apt-get update && sudo apt-get install -y jq
          semgrep --version

      - name: Run Semgrep
        run: semgrep scan --config=auto --json > semgrep_report.json || true

      - name: Display Semgrep Results
        run: |
          if [ -s semgrep_report.json ] && [ $(jq '.results | length' semgrep_report.json) -gt 0 ]; then
            echo "### Semgrep Vulnerabilities Found:"
            jq -r '.results[] | "| " + (.path // "N/A") + " | " + (.check_id // "N/A") + " | " + (.extra.message // "N/A") + " |"' semgrep_report.json
          else
            echo "No vulnerabilities found in Semgrep."
          fi

      - name: Delete Previous Semgrep Reports in DefectDojo
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DEFECTDOJO_ENGAGEMENT_ID: ${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}
        run: |
          response=$(curl -s -X GET "$DEFECTDOJO_URL/api/v2/import-scan/?engagement=$DEFECTDOJO_ENGAGEMENT_ID" -H "Authorization: Token $DEFECTDOJO_API_KEY")
          report_ids=$(echo "$response" | jq -r '.results[]? | select(.scan_type=="Semgrep JSON Report") | .id')
          for id in $report_ids; do
            echo "Deleting Semgrep report with ID: $id"
            curl -s -X DELETE "$DEFECTDOJO_URL/api/v2/import-scan/$id/" -H "Authorization: Token $DEFECTDOJO_API_KEY"
          done

      - name: Upload Semgrep Report to DefectDojo if Vulnerabilities Found
        run: |
          if [ -s semgrep_report.json ] && [ $(jq '.results | length' semgrep_report.json) -gt 0 ]; then
            curl -s -X POST "$DEFECTDOJO_URL/api/v2/import-scan/" \
              -H "Authorization: Token $DEFECTDOJO_API_KEY" \
              -F "scan_type=Semgrep JSON Report" \
              -F "engagement=$DEFECTDOJO_ENGAGEMENT_ID" \
              -F "file=@semgrep_report.json"
          fi

  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get install -y apt-transport-https curl gnupg lsb-release
          curl -fsSL https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy-keyring.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
          trivy --version

      - name: Run Trivy on Repository
        run: trivy filesystem --format json --output trivy_report.json . || true

      - name: Upload Trivy Report to DefectDojo if Vulnerabilities Found
        run: |
          if [ -s trivy_report.json ] && [ $(jq '.Results | length' trivy_report.json) -gt 0 ]; then
            curl -s -X POST "$DEFECTDOJO_URL/api/v2/import-scan/" \
              -H "Authorization: Token $DEFECTDOJO_API_KEY" \
              -F "scan_type=Trivy JSON Report" \
              -F "engagement=$DEFECTDOJO_ENGAGEMENT_ID" \
              -F "file=@trivy_report.json"
          fi

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r '.tag_name')
          wget -O gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Run Gitleaks
        run: gitleaks detect -r gitleaks_report.json --format json || true

      - name: Display Gitleaks Results
        run: |
          if [ -s gitleaks_report.json ] && [ $(jq '.leaks | length' gitleaks_report.json) -gt 0 ]; then
            echo "### Gitleaks Vulnerabilities Found:"
            jq -r '.leaks[] | "| " + (.rule // "N/A") + " | " + (.file // "N/A") + " |"' gitleaks_report.json
          else
            echo "No vulnerabilities found in Gitleaks."
          fi

      - name: Upload Gitleaks Report to DefectDojo if Vulnerabilities Found
        run: |
          if [ -s gitleaks_report.json ] && [ $(jq '.leaks | length' gitleaks_report.json) -gt 0 ]; then
            curl -s -X POST "$DEFECTDOJO_URL/api/v2/import-scan/" \
              -H "Authorization: Token $DEFECTDOJO_API_KEY" \
              -F "scan_type=Gitleaks JSON Report" \
              -F "engagement=$DEFECTDOJO_ENGAGEMENT_ID" \
              -F "file=@gitleaks_report.json"
          fi

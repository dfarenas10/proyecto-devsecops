name: DevSecOps Pipeline

on: [push, pull_request]

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep and jq
        run: |
          pip install semgrep
          sudo apt-get update && sudo apt-get install -y jq
          semgrep --version

      - name: Run Semgrep
        run: semgrep scan --config=auto --json > semgrep_report.json || true

      - name: Remove old Semgrep reports from DefectDojo
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
        run: |
          report_ids=$(curl -s -X GET "$DEFECTDOJO_URL/api/v2/findings/?test__engagement=$DEFECTDOJO_ENGAGEMENT_ID&test__test_type=Semgrep" \
            -H "Authorization: Token $DEFECTDOJO_API_KEY" | jq -r '.results[].id')

          if [ -n "$report_ids" ]; then
            for id in $report_ids; do
              curl -s -X DELETE "$DEFECTDOJO_URL/api/v2/findings/$id/" -H "Authorization: Token $DEFECTDOJO_API_KEY"
            done
          else
            echo "No previous Semgrep reports found in DefectDojo."
          fi

  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget
          TRIVY_LATEST_VERSION=$(curl -s https://api.github.com/repos/aquasecurity/trivy/releases/latest | jq -r '.tag_name' | sed 's/v//')
          wget "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_LATEST_VERSION}/trivy_${TRIVY_LATEST_VERSION}_Linux-64bit.tar.gz"
          tar zxvf "trivy_${TRIVY_LATEST_VERSION}_Linux-64bit.tar.gz"
          sudo mv trivy /usr/local/bin/
          trivy --version

      - name: Run Trivy
        run: trivy filesystem --format json --output trivy_report.json . || true

      - name: Remove old Trivy reports from DefectDojo
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
        run: |
          report_ids=$(curl -s -X GET "$DEFECTDOJO_URL/api/v2/findings/?test__engagement=$DEFECTDOJO_ENGAGEMENT_ID&test__test_type=Trivy" \
            -H "Authorization: Token $DEFECTDOJO_API_KEY" | jq -r '.results[].id')

          if [ -n "$report_ids" ]; then
            for id in $report_ids; do
              curl -s -X DELETE "$DEFECTDOJO_URL/api/v2/findings/$id/" -H "Authorization: Token $DEFECTDOJO_API_KEY"
            done
          else
            echo "No previous Trivy reports found in DefectDojo."
          fi

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r '.tag_name')
          wget -O gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Run Gitleaks
        run: gitleaks detect -r gitleaks_report.json --format json || true

      - name: Remove old Gitleaks reports from DefectDojo
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
        run: |
          report_ids=$(curl -s -X GET "$DEFECTDOJO_URL/api/v2/findings/?test__engagement=$DEFECTDOJO_ENGAGEMENT_ID&test__test_type=Gitleaks" \
            -H "Authorization: Token $DEFECTDOJO_API_KEY" | jq -r '.results[].id')

          if [ -n "$report_ids" ]; then
            for id in $report_ids; do
              curl -s -X DELETE "$DEFECTDOJO_URL/api/v2/findings/$id/" -H "Authorization: Token $DEFECTDOJO_API_KEY"
            done
          else
            echo "No previous Gitleaks reports found in DefectDojo."
          fi

name: DevSecOps Pipeline

on: [push, pull_request]

jobs:
  check-defectdojo-reports:
    runs-on: ubuntu-latest
    outputs:
      reports_exist: ${{ steps.check-reports.outputs.reports_exist }}
    steps:
      - name: Check for existing reports in DefectDojo
        id: check-reports
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DEFECTDOJO_ENGAGEMENT_ID: ${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}
        run: |
          response=$(curl -s -X GET "$DEFECTDOJO_URL/api/v2/findings/?engagement=$DEFECTDOJO_ENGAGEMENT_ID" \
            -H "Authorization: Token $DEFECTDOJO_API_KEY" \
            -H "Accept: application/json")
          report_count=$(echo "$response" | jq '.count')
          if [ "$report_count" -gt 0 ]; then
            echo "Existing reports found: $report_count"
            echo "reports_exist=true" >> $GITHUB_ENV
          else
            echo "No previous reports found."
            echo "reports_exist=false" >> $GITHUB_ENV
          fi

      - name: Delete existing reports (if any)
        if: env.reports_exist == 'true'
        run: |
          report_ids=$(curl -s -X GET "$DEFECTDOJO_URL/api/v2/findings/?engagement=$DEFECTDOJO_ENGAGEMENT_ID" \
            -H "Authorization: Token $DEFECTDOJO_API_KEY" \
            -H "Accept: application/json" | jq -r '.results[].id')
          for report_id in $report_ids; do
            curl -s -X DELETE "$DEFECTDOJO_URL/api/v2/findings/$report_id/" \
              -H "Authorization: Token $DEFECTDOJO_API_KEY"
            echo "Deleted report ID: $report_id"
          done

  semgrep:
    runs-on: ubuntu-latest
    needs: check-defectdojo-reports
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep and jq
        run: |
          pip install semgrep
          sudo apt-get update && sudo apt-get install -y jq
          semgrep --version

      - name: Run Semgrep
        run: semgrep scan --config=auto --json > semgrep_report.json || true

      - name: Display Semgrep Results
        run: |
          if [ -s semgrep_report.json ] && [ "$(jq '.results | length' semgrep_report.json)" -gt 0 ]; then
            echo "### Semgrep Vulnerabilities Found:"
            jq -r '.results[] | "| " + (.path // "N/A") + " | " + (.check_id // "N/A") + " | " + (.extra.message // "N/A") + " |"' semgrep_report.json
          else
            echo "No vulnerabilities found in Semgrep."
          fi

      - name: Upload Semgrep Report to DefectDojo
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DEFECTDOJO_ENGAGEMENT_ID: ${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}
        run: |
          if [ -s semgrep_report.json ] && [ "$(jq '.results | length' semgrep_report.json)" -gt 0 ]; then
            curl -X POST "$DEFECTDOJO_URL/api/v2/import-scan/" \
              -H "Authorization: Token $DEFECTDOJO_API_KEY" \
              -H "Content-Type: multipart/form-data" \
              -F "scan_type=Semgrep JSON Report" \
              -F "engagement=$DEFECTDOJO_ENGAGEMENT_ID" \
              -F "file=@semgrep_report.json"
          fi

  trivy:
    runs-on: ubuntu-latest
    needs: check-defectdojo-reports
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_Linux-64bit.tar.gz
          tar zxvf trivy_Linux-64bit.tar.gz
          sudo mv trivy /usr/local/bin/
          trivy --version

      - name: Run Trivy
        run: trivy filesystem --format json --output trivy_report.json . || true

      - name: Display Trivy Results
        run: |
          if [ -s trivy_report.json ] && [ "$(jq '.Results | length' trivy_report.json)" -gt 0 ]; then
            echo "### Trivy Vulnerabilities Found:"
            jq -r '.Results[]?.Vulnerabilities[]? | "| " + (.VulnerabilityID // "N/A") + " | " + (.PkgName // "N/A") + " | " + (.Severity // "N/A") + " |"' trivy_report.json
          else
            echo "No vulnerabilities found in Trivy."
          fi

      - name: Upload Trivy Report to DefectDojo
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DEFECTDOJO_ENGAGEMENT_ID: ${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}
        run: |
          if [ -s trivy_report.json ] && [ "$(jq '.Results | length' trivy_report.json)" -gt 0 ]; then
            curl -X POST "$DEFECTDOJO_URL/api/v2/import-scan/" \
              -H "Authorization: Token $DEFECTDOJO_API_KEY" \
              -H "Content-Type: multipart/form-data" \
              -F "scan_type=Trivy Scan" \
              -F "engagement=$DEFECTDOJO_ENGAGEMENT_ID" \
              -F "file=@trivy_report.json"
          fi

  gitleaks:
    runs-on: ubuntu-latest
    needs: check-defectdojo-reports
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          wget -O gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_Linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Run Gitleaks
        run: gitleaks detect -r gitleaks_report.json --format json || true

      - name: Display Gitleaks Results
        run: |
          if [ -s gitleaks_report.json ] && [ "$(jq '.leaks | length' gitleaks_report.json)" -gt 0 ]; then
            echo "### Gitleaks Vulnerabilities Found:"
            jq -r '.leaks[] | "| " + (.file // "N/A") + " | " + (.line // "N/A") + " | " + (.rule // "N/A") + " |"' gitleaks_report.json
          else
            echo "No vulnerabilities found in Gitleaks."
          fi

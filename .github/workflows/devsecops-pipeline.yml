name: DevSecOps Pipeline

on: [push, pull_request]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: zricethezav/gitleaks-action@v1.6.0
        with:
          config-path: .github/.gitleaks.toml

      - name: Upload Gitleaks Report to DefectDojo (if vulnerabilities found)
        run: |
          if grep -q '"results": \[\]' gitleaks_report.json; then
            echo "No vulnerabilities found. Skipping upload to DefectDojo."
          else
            curl -X POST "http://3.136.229.202:8080/api/v2/import-scan/" \
              -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d @gitleaks_report.json
          fi

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: |
          pip install semgrep
          semgrep --version

      - name: Run Semgrep
        run: |
          semgrep scan --config=auto --json > semgrep_report.json

      - name: Upload Semgrep Report to DefectDojo (if vulnerabilities found)
        run: |
          if grep -q '"results": \[\]' semgrep_report.json; then
            echo "No vulnerabilities found. Skipping upload to DefectDojo."
          else
            curl -X POST "http://3.136.229.202:8080/api/v2/import-scan/" \
              -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d @semgrep_report.json
          fi

  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.46.0_Linux-64bit.tar.gz
          tar -xzf trivy_0.46.0_Linux-64bit.tar.gz
          sudo mv trivy /usr/local/bin/
          trivy --version

      - name: Run Trivy filesystem scan
        run: |
          trivy fs --scanners vuln,secret --format json -o trivy_report.json .

      - name: Upload Trivy Report to DefectDojo (if vulnerabilities found)
        run: |
          if grep -q '"Results": \[\]' trivy_report.json; then
            echo "No vulnerabilities found. Skipping upload to DefectDojo."
          else
            curl -X POST "http://3.136.229.202:8080/api/v2/import-scan/" \
              -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d @trivy_report.json
          fi

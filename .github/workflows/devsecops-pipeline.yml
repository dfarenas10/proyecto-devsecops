name: DevSecOps Pipeline

on: [push, pull_request]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: zricethezav/gitleaks-action@v1.6.0
        with:
          config-path: .github/.gitleaks.toml

      - name: Display Gitleaks Results
        run: |
          if [ -f gitleaks_report.json ]; then
            echo "### Gitleaks Vulnerabilities Found:"
            echo "| File | Rule | Commit |"
            echo "|------|------|--------|"
            jq -r '.results[] | "| " + .file + " | " + .rule + " | " + .commit + " |"' gitleaks_report.json || echo "No vulnerabilities found."
          else
            echo "No vulnerabilities found."
          fi

      - name: Upload Gitleaks Report to DefectDojo
        run: |
          if [ -f gitleaks_report.json ] && ! grep -q '"results": \[\]' gitleaks_report.json; then
            curl -X POST "http://3.136.229.202:8080/api/v2/import-scan/" \
              -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d @gitleaks_report.json
          else
            echo "No vulnerabilities found or report file missing. Skipping upload."
          fi

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: |
          pip install semgrep
          semgrep --version

      - name: Run Semgrep
        run: |
          semgrep scan --config=auto --json > semgrep_report.json

      - name: Display Semgrep Results
        run: |
          if [ -f semgrep_report.json ]; then
            echo "### Semgrep Vulnerabilities Found:"
            echo "| Path | Check ID | Message |"
            echo "|------|----------|---------|"
            jq -r '.results[] | "| " + .path + " | " + .check_id + " | " + .extra.message + " |"' semgrep_report.json || echo "No vulnerabilities found."
          else
            echo "No vulnerabilities found."
          fi

      - name: Upload Semgrep Report to DefectDojo
        run: |
          if [ -f semgrep_report.json ] && ! grep -q '"results": \[\]' semgrep_report.json; then
            curl -X POST "http://3.136.229.202:8080/api/v2/import-scan/" \
              -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d @semgrep_report.json
          else
            echo "No vulnerabilities found or report file missing. Skipping upload."
          fi

  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl jq
          TRIVY_VERSION=$(curl -s https://api.github.com/repos/aquasecurity/trivy/releases/latest | jq -r .tag_name)
          wget "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          tar -xzf trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz
          sudo mv trivy /usr/local/bin/
          trivy --version

      - name: Run Trivy filesystem scan
        run: |
          trivy fs --scanners vuln,secret --format json -o trivy_report.json .

      - name: Display Trivy Results
        run: |
          if [ -f trivy_report.json ]; then
            echo "### Trivy Vulnerabilities Found:"
            echo "| Vulnerability ID | Package | Severity |"
            echo "|------------------|---------|----------|"
            jq -r '.Results[] | .Vulnerabilities[]? | "| " + .VulnerabilityID + " | " + .PkgName + " | " + .Severity + " |"' trivy_report.json || echo "No vulnerabilities found."
          else
            echo "No vulnerabilities found."
          fi

      - name: Upload Trivy Report to DefectDojo
        run: |
          if [ -f trivy_report.json ] && ! grep -q '"Results": \[\]' trivy_report.json; then
            curl -X POST "http://3.136.229.202:8080/api/v2/import-scan/" \
              -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d @trivy_report.json
          else
            echo "No vulnerabilities found or report file missing. Skipping upload."
          fi
